<app-layout>
  <div slot="header" class="space-y-1 py-1">
    <h1 class="text-xl font-bold tracking-tight">ovidio</h1>
    <p class="text-sm text-base-content/70">
      Web Components nativos + Tailwind + DaisyUI
    </p>
  </div>

  <ui-section
    title="1. Input nativo"
    description="El navegador ya refleja lo que escribís. No hace falta un sistema reactivo."
  >
    <ui-echo-field label="Escribí algo" placeholder="hola"></ui-echo-field>
  </ui-section>

  <ui-section
    title="2. Props no reactivas + slot"
    description="title / badge se aplican al montar. Mutar attributes no re-pinta hasta applyProps()."
  >
    <ui-card id="demo-card" title="Card con slot" badge="DaisyUI">
      <p>Este párrafo entra por el <strong>slot</strong> (light DOM).</p>
      <p class="text-sm opacity-70">Composición anidada: section → card → contenido.</p>
    </ui-card>

    <ui-actions id="demo-actions">
      <button type="button" data-mutate class="btn btn-outline btn-sm">
        Mutar attributes (sin applyProps)
      </button>
      <button type="button" data-apply class="btn btn-secondary btn-sm">
        Llamar applyProps()
      </button>
    </ui-actions>
  </ui-section>

  <ui-section
    title="3. Reactividad selectiva"
    description="Un signal mínimo + bindText. Solo el nodo del reloj se actualiza."
  >
    <ui-clock></ui-clock>
  </ui-section>

  <ui-section
    title="4. Contador con signal"
    description="El botón y el layout no se regeneran; solo el número."
  >
    <ui-counter></ui-counter>
  </ui-section>

  <div slot="footer">
    <p>Layout con slots · composición en HTML · lógica en TS</p>
  </div>
</app-layout>
